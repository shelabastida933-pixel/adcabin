name: 部署官网到腾讯云服务器

# 触发方式：
#   1. push 到 main（我改完文案推上去就自动部署）
#   2. 在 GitHub 网页上手动点「Run workflow」
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发写同一台服务器
concurrency:
  group: deploy-adcabin
  cancel-in-progress: false

jobs:
  deploy:
    name: 同步到 adcabin.yuhuakeji.com.cn
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      # ---------------------------------------------------------------
      # 未配置密钥时优雅跳过，避免首次推送就出现红色失败
      # ---------------------------------------------------------------
      - name: 检查部署密钥是否已配置
        id: cfg
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::notice title=跳过部署::尚未配置部署密钥。请按 deploy/CI-CD部署指南.md 配置 Repository Secrets 后重跑本工作流。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "密钥已配置，准备部署"
          fi

      # ---------------------------------------------------------------
      # 安全闸门：所有目标路径必须位于宝塔站点目录下 (/www/wwwroot/)
      # ---------------------------------------------------------------
      - name: 安全校验（路径白名单）
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_COMPANY: ${{ secrets.DEPLOY_PATH_COMPANY }}
        run: |
          check_path() {
            local name="$1" p="$2"
            if [ -z "$p" ]; then
              echo "  · $name 未配置，跳过该校验"
              return 0
            fi
            echo "  · $name = $p"
            case "$p" in
              /www/wwwroot/*)
                case "$p" in
                  *..*|*\**)
                    echo "::error title=路径非法::$name 含 .. 或通配符，已中止"
                    return 1 ;;
                esac
                return 0 ;;
              *)
                echo "::error title=路径越界::$name 必须位于 /www/wwwroot/ 之下，当前为 $p，已中止以防误改服务器文件"
                return 1 ;;
            esac
          }
          ok=1
          check_path "DEPLOY_PATH（投流舱）" "${DEPLOY_PATH}" || ok=0
          check_path "DEPLOY_PATH_COMPANY（公司官网）" "${DEPLOY_PATH_COMPANY}" || ok=0
          [ "$ok" = "1" ] || exit 1
          echo "✅ 路径校验通过"

      - name: 配置 SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接自动接受主机指纹（免去手工维护 known_hosts）
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            Port ${SSH_PORT:-22}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: 测试 SSH 连通性
        if: steps.cfg.outputs.skip != 'true'
        run: |
          echo "=============================================="
          echo " 本次使用的私钥指纹（请与服务器对比）"
          echo "=============================================="
          if ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/derived.pub 2>/tmp/keyerr; then
            FP=$(ssh-keygen -lf /tmp/derived.pub)
            echo "  $FP"
            echo ""
            echo "  服务器上请执行下面这条，两者的指纹【必须完全一致】："
            echo "    ssh-keygen -lf ~/.ssh/authorized_keys"
            echo ""
            echo "  派生的公钥内容（仅供比对，这是公开信息）："
            cat /tmp/derived.pub
          else
            echo "::error title=私钥无法解析::GitHub Secret「SSH_PRIVATE_KEY」的内容不是有效的私钥。常见原因：① 误填了 .pub 公钥文件 ② 复制时漏掉了 -----BEGIN/END----- 首尾两行 ③ 换行被破坏成了一行"
            echo "--- ssh-keygen 报错 ---"
            cat /tmp/keyerr
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo " 连接测试（详细模式）"
          echo "=============================================="
          set +e
          ssh -v deploy-target 'echo "连接成功: $(whoami)@$(hostname)"' > /tmp/ssh.log 2>&1
          rc=$?
          set -e
          grep -Ei "Offering public key|Server accepts key|Authentications that can continue|Next authentication method|Permission denied|Connection (refused|timed out|closed)|Load key" /tmp/ssh.log | head -20 || true

          if [ "$rc" != "0" ]; then
            echo ""
            echo "::error title=SSH 公钥认证失败::按顺序排查：① 服务器 authorized_keys 里是否包含上面打印的那个指纹（不一致说明 Secret 内容或公钥装错了）② 权限必须是 .ssh=700、authorized_keys=600、家目录不可被 group/other 写 ③ OpenCloudOS/RHEL 系需执行 restorecon -Rv 家目录/.ssh 修复 SELinux 上下文 ④ SSH_USER 是否与服务器实际用户名完全一致（不能有空格或换行）⑤ 该账号是否被锁定或过期（chage -l 用户名）"
            exit 1
          fi
          echo "✅ SSH 连接成功"

          ssh deploy-target 'which rsync >/dev/null && echo "✅ rsync 可用" || (echo "::error::服务器未安装 rsync，请执行 yum install -y rsync 或 apt install -y rsync"; exit 1)'

      # ---------------------------------------------------------------
      # 预检：把「目录不存在」「无写权限」这类问题翻译成可操作的中文提示，
      # 而不是让 rsync 抛一个看不懂的报错
      # ---------------------------------------------------------------
      - name: 预检目标目录
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "检查 ${DEPLOY_PATH}"

          if ! ssh deploy-target "test -d '${DEPLOY_PATH}'"; then
            echo "::error title=目标目录不存在::服务器上没有 ${DEPLOY_PATH}。 解决办法：在宝塔【网站 → 添加站点】创建站点，域名填 adcabin.yuhuakeji.com.cn，PHP 版本选「纯静态」，不要创建数据库和 FTP。"
            echo ""
            echo "服务器上现有的站点目录："
            ssh deploy-target "ls -1d /www/wwwroot/*/ 2>/dev/null || echo '  (无)'"
            exit 1
          fi
          echo "✅ 目录存在"

          if ! ssh deploy-target "test -w '${DEPLOY_PATH}'"; then
            echo "::error title=部署账号没有写权限::${DEPLOY_PATH} 对当前部署账号不可写。 请执行：chown -R \$USER:\$USER '${DEPLOY_PATH}'（把 \$USER 换成你的 SSH_USER）"
            echo "当前属主与权限："
            ssh deploy-target "ls -ld '${DEPLOY_PATH}'"
            exit 1
          fi
          echo "✅ 目录可写"

          # 检查 SSH_PORT 是否真的是 22（sshd_config 里 Port 常被注释）
          echo "✅ 预检通过，开始同步"

      # ---------------------------------------------------------------
      # 同步文件
      #   --delete   让服务器与仓库保持一致（删除已下线文件）
      #   排除项说明（宝塔服务器必须排除，否则 --delete 会破坏服务）：
      #     .well-known/   Let's Encrypt 证书验证目录，删掉会导致证书无法续期
      #     .user.ini      宝塔的 PHP 防跨站保护文件，且带 immutable 属性 ——
      #                    rsync 删不掉它会导致整个部署报错失败
      #     404.html       宝塔默认错误页，保留
      # ---------------------------------------------------------------
      # 注意：-e 的字符串由 rsync 直接 exec，不经过 shell，
      # 所以这里必须用 $HOME（由 bash 展开）而不是 ~ 或 ~/.ssh/config。
      # 用 ~ 会原样传给 ssh 导致 "Can't open user config file"。
      # ---------------------------------------------------------------
      # 同步站点文件
      #   【刻意不使用 --delete】——服务器上已存在的、仓库里没有的文件一律不动。
      #   这样即便站点根目录里有历史遗留文件（旧页面、上传的图片、各类验证文件），
      #   也绝不会被误删。代价只是重命名/删除文件后旧文件会残留，可手工清理。
      #   排除项：
      #     company/            公司官网源码在本仓库的 company/ 子目录，不能同步到这里
      #     .well-known/        Let's Encrypt 证书验证目录
      #     .user.ini           宝塔的 PHP 防跨站保护文件（带 immutable 属性）
      #     baidu_verify_* 等   搜索引擎验证文件，删除会导致验证失效
      # ---------------------------------------------------------------
      - name: 同步投流舱站点文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlptzv --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='company/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='baidu_verify_*' \
            --exclude='google*.html' \
            --exclude='BingSiteAuth.xml' \
            --exclude='sogousiteverification.txt' \
            --exclude='404.html' \
            --exclude='.gitignore' \
            --exclude='.nojekyll' \
            --exclude='deploy/' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ deploy-target:"${DEPLOY_PATH}/"

      # ---------------------------------------------------------------
      # 同步公司官网（宇华科技 yuhuakeji.com.cn）
      #   源码位于仓库的 company/ 子目录。
      #   同样【不使用 --delete】，服务器上已有的 demo.html / Aipic.html /
      #   上传的图片等历史文件完全不受影响。
      #   未配置 DEPLOY_PATH_COMPANY 时自动跳过，不影响投流舱的部署。
      # ---------------------------------------------------------------
      - name: 同步公司官网文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH_COMPANY: ${{ secrets.DEPLOY_PATH_COMPANY }}
        run: |
          if [ -z "$DEPLOY_PATH_COMPANY" ]; then
            echo "::notice title=跳过公司官网部署::未配置 DEPLOY_PATH_COMPANY。若需一并部署，添加该 Secret（值为 /www/wwwroot/yuhuakeji.com.cn）并在服务器上把该目录属主改为部署账号。"
            exit 0
          fi
          if [ ! -d company ]; then
            echo "::warning title=缺少源码::仓库中没有 company/ 目录，跳过"
            exit 0
          fi
          if ! ssh deploy-target "test -d '${DEPLOY_PATH_COMPANY}'"; then
            echo "::error title=目标目录不存在::服务器上没有 ${DEPLOY_PATH_COMPANY}"
            ssh deploy-target "ls -1d /www/wwwroot/*/ 2>/dev/null || echo '  (无)'"
            exit 1
          fi
          if ! ssh deploy-target "test -w '${DEPLOY_PATH_COMPANY}'"; then
            echo "::error title=无写权限::${DEPLOY_PATH_COMPANY} 对部署账号不可写。请在服务器执行：chown -R <部署账号>:<部署账号> '${DEPLOY_PATH_COMPANY}'"
            ssh deploy-target "ls -ld '${DEPLOY_PATH_COMPANY}'"
            exit 1
          fi
          echo "--- 部署前：目标目录现有文件（不会被删除）---"
          ssh deploy-target "ls -la '${DEPLOY_PATH_COMPANY}'"
          rsync -rlptzv --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='baidu_verify_*' \
            --exclude='google*.html' \
            --exclude='BingSiteAuth.xml' \
            --exclude='sogousiteverification.txt' \
            --exclude='src/' \
            --exclude='tailwind.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='改造说明.txt' \
            --exclude='node_modules/' \
            -e "ssh -F $HOME/.ssh/config" \
            company/ deploy-target:"${DEPLOY_PATH_COMPANY}/"
          echo "--- 部署后：确认关键文件已就位 ---"
          ssh deploy-target "test -f '${DEPLOY_PATH_COMPANY}/index.html' && echo '✅ index.html' ; test -f '${DEPLOY_PATH_COMPANY}/assets/tailwind.css' && echo '✅ assets/tailwind.css'"

      - name: 校验服务器上的文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh deploy-target "ls -la '${DEPLOY_PATH}' && echo '---' && test -f '${DEPLOY_PATH}/index.html' && echo '✅ index.html 存在' && test -f '${DEPLOY_PATH}/assets/qr.png' && echo '✅ assets/qr.png 存在'"

      # ---------------------------------------------------------------
      # 部署后线上验证：内容、编码、资源可达
      # ---------------------------------------------------------------
      - name: 线上验证
        if: steps.cfg.outputs.skip != 'true'
        run: |
          HTTPS_URL="https://adcabin.yuhuakeji.com.cn/"
          HTTP_URL="http://adcabin.yuhuakeji.com.cn/"

          URL=""
          for base in "$HTTPS_URL" "$HTTP_URL"; do
            for i in $(seq 1 6); do
              code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 20 "$base" || echo 000)
              [ "$code" = "200" ] && { URL="$base"; break; }
              echo "  $base -> HTTP $code，10 秒后重试 ($i/6)"
              sleep 10
            done
            [ -n "$URL" ] && break
          done

          if [ -z "$URL" ]; then
            echo "::error title=线上访问失败::DNS 解析或宝塔站点未生效。请确认：① DNSPod 已加 adcabin -> 62.234.44.62 的 A 记录 ② 宝塔已创建站点 ③ 站点根目录文件已就位"
            exit 1
          fi
          echo "✅ 可访问: $URL"

          if [ "$URL" = "$HTTP_URL" ]; then
            echo "::warning title=SSL 未就绪::目前仅能通过 http 访问。请在宝塔【站点设置 → SSL → Let's Encrypt】申请证书并开启「强制 HTTPS」，否则微信内会提示不安全。"
          else
            echo "✅ HTTPS 已就绪"
          fi

          echo "--- 内容校验 ---"
          fail=0
          for kw in "投流舱" "舱长负责跑量" "Skill 定制 + MCP 接入" "协助开户服务费" "种子客户招募" "剩余 3 席" "完整计费与退款细则"; do
            if grep -q "$kw" /tmp/index.html; then
              echo "  ✅ $kw"
            else
              echo "  ❌ 缺少: $kw"
              fail=1
            fi
          done

          echo "--- 资源校验 ---"
          qr=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}assets/qr.png" || echo 000)
          echo "  assets/qr.png -> HTTP $qr"
          [ "$qr" = "200" ] || fail=1

          if [ "$fail" = "0" ]; then
            echo "🎉 部署完成且验证通过"
          else
            echo "::error::线上内容校验未通过"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 主动推送到百度站长平台（加速收录）
      # 未配置 BAIDU_TOKEN 时优雅跳过，不影响部署
      # token 获取方式：https://ziyuan.baidu.com → 普通收录 → 资源提交 → API 提交
      # ---------------------------------------------------------------
      - name: 推送到百度站长平台
        if: steps.cfg.outputs.skip != 'true'
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: |
          if [ -z "$BAIDU_TOKEN" ]; then
            echo "::notice title=跳过百度推送::未配置 BAIDU_TOKEN。到百度站长平台（ziyuan.baidu.com）「普通收录 → API 提交」拿到 token 后，添加名为 BAIDU_TOKEN 的 Secret 即可每次部署自动推送。"
            exit 0
          fi
          SITE="https://adcabin.yuhuakeji.com.cn/"
          # 主动推送：把本次上线的 URL 提交给百度
          resp=$(curl -s --max-time 30 -H 'Content-Type:text/plain' \
            --data-binary "$SITE" \
            "http://data.zz.baidu.com/urls?site=${SITE}&token=${BAIDU_TOKEN}" || echo '{"error":"curl failed"}')
          echo "百度返回: $resp"
          if echo "$resp" | grep -q '"success"'; then
            echo "✅ 已成功推送到百度"
          elif echo "$resp" | grep -q '"error"'; then
            echo "::warning title=百度推送失败::返回 $resp —— 常见原因：token 无效、站点未在百度站长平台验证、或当日配额用尽。不影响网站正常运行。"
          else
            echo "::warning title=百度推送结果未知::返回 $resp"
          fi

      - name: 部署摘要
        if: steps.cfg.outputs.skip != 'true' && always()
        run: |
          {
            echo "## 官网部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 访问地址 | https://adcabin.yuhuakeji.com.cn/ |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 结果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
