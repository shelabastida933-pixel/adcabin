name: 部署官网到腾讯云服务器

# 触发方式：
#   1. push 到 main（我改完文案推上去就自动部署）
#   2. 在 GitHub 网页上手动点「Run workflow」（全量推 URL）
#   3. 每天定时一次：只为把百度待推队列里积压的 URL 推出去
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:
  schedule:
    # 每天 01:30 UTC = 北京 09:30。
    # 意义：百度配额只有 10 条/天，超出部分进待推队列；如果只靠 push 触发，
    # 队列要等到「下次有人提交」才推进 —— 长期不提交就永远不推。
    # 定时跑一次，即使没有任何代码改动也会把队列清空（CHANGED 为空，不重复推旧页面）。
    - cron: '30 1 * * *'

# 同一时间只跑一个部署，避免并发写同一台服务器
concurrency:
  group: deploy-adcabin
  cancel-in-progress: false

jobs:
  deploy:
    name: 同步到 adcabin.yuhuakeji.com.cn
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 2 是必须的 —— 后面「只推改动的页面」需要 HEAD^ 做 diff。
      # actions/checkout 默认 fetch-depth: 1（浅克隆），那样 git rev-parse HEAD^
      # 会失败，导致每次都退化为「推送全部 URL」，白耗 10 条/天的配额。
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # ---------------------------------------------------------------
      # 未配置密钥时优雅跳过，避免首次推送就出现红色失败
      # ---------------------------------------------------------------
      - name: 检查部署密钥是否已配置
        id: cfg
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::notice title=跳过部署::尚未配置部署密钥。请按 deploy/CI-CD部署指南.md 配置 Repository Secrets 后重跑本工作流。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "密钥已配置，准备部署"
          fi

      # ---------------------------------------------------------------
      # 安全闸门：所有目标路径必须位于宝塔站点目录下 (/www/wwwroot/)
      # ---------------------------------------------------------------
      - name: 安全校验（路径白名单）
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PATH_COMPANY: ${{ secrets.DEPLOY_PATH_COMPANY }}
        run: |
          check_path() {
            local name="$1" p="$2"
            if [ -z "$p" ]; then
              echo "  · $name 未配置，跳过该校验"
              return 0
            fi
            echo "  · $name = $p"
            case "$p" in
              /www/wwwroot/*)
                case "$p" in
                  *..*|*\**)
                    echo "::error title=路径非法::$name 含 .. 或通配符，已中止"
                    return 1 ;;
                esac
                return 0 ;;
              *)
                echo "::error title=路径越界::$name 必须位于 /www/wwwroot/ 之下，当前为 $p，已中止以防误改服务器文件"
                return 1 ;;
            esac
          }
          ok=1
          check_path "DEPLOY_PATH（投流舱）" "${DEPLOY_PATH}" || ok=0
          check_path "DEPLOY_PATH_COMPANY（公司官网）" "${DEPLOY_PATH_COMPANY}" || ok=0
          [ "$ok" = "1" ] || exit 1
          echo "✅ 路径校验通过"

      - name: 配置 SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接自动接受主机指纹（免去手工维护 known_hosts）
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            Port ${SSH_PORT:-22}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: 测试 SSH 连通性
        if: steps.cfg.outputs.skip != 'true'
        run: |
          echo "=============================================="
          echo " 本次使用的私钥指纹（请与服务器对比）"
          echo "=============================================="
          if ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/derived.pub 2>/tmp/keyerr; then
            FP=$(ssh-keygen -lf /tmp/derived.pub)
            echo "  $FP"
            echo ""
            echo "  服务器上请执行下面这条，两者的指纹【必须完全一致】："
            echo "    ssh-keygen -lf ~/.ssh/authorized_keys"
            echo ""
            echo "  派生的公钥内容（仅供比对，这是公开信息）："
            cat /tmp/derived.pub
          else
            echo "::error title=私钥无法解析::GitHub Secret「SSH_PRIVATE_KEY」的内容不是有效的私钥。常见原因：① 误填了 .pub 公钥文件 ② 复制时漏掉了 -----BEGIN/END----- 首尾两行 ③ 换行被破坏成了一行"
            echo "--- ssh-keygen 报错 ---"
            cat /tmp/keyerr
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo " 连接测试（详细模式）"
          echo "=============================================="
          set +e
          ssh -v deploy-target 'echo "连接成功: $(whoami)@$(hostname)"' > /tmp/ssh.log 2>&1
          rc=$?
          set -e
          grep -Ei "Offering public key|Server accepts key|Authentications that can continue|Next authentication method|Permission denied|Connection (refused|timed out|closed)|Load key" /tmp/ssh.log | head -20 || true

          if [ "$rc" != "0" ]; then
            echo ""
            echo "::error title=SSH 公钥认证失败::按顺序排查：① 服务器 authorized_keys 里是否包含上面打印的那个指纹（不一致说明 Secret 内容或公钥装错了）② 权限必须是 .ssh=700、authorized_keys=600、家目录不可被 group/other 写 ③ OpenCloudOS/RHEL 系需执行 restorecon -Rv 家目录/.ssh 修复 SELinux 上下文 ④ SSH_USER 是否与服务器实际用户名完全一致（不能有空格或换行）⑤ 该账号是否被锁定或过期（chage -l 用户名）"
            exit 1
          fi
          echo "✅ SSH 连接成功"

          ssh deploy-target 'which rsync >/dev/null && echo "✅ rsync 可用" || (echo "::error::服务器未安装 rsync，请执行 yum install -y rsync 或 apt install -y rsync"; exit 1)'

      # ---------------------------------------------------------------
      # 预检：把「目录不存在」「无写权限」这类问题翻译成可操作的中文提示，
      # 而不是让 rsync 抛一个看不懂的报错
      # ---------------------------------------------------------------
      - name: 预检目标目录
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "检查 ${DEPLOY_PATH}"

          if ! ssh deploy-target "test -d '${DEPLOY_PATH}'"; then
            echo "::error title=目标目录不存在::服务器上没有 ${DEPLOY_PATH}。 解决办法：在宝塔【网站 → 添加站点】创建站点，域名填 adcabin.yuhuakeji.com.cn，PHP 版本选「纯静态」，不要创建数据库和 FTP。"
            echo ""
            echo "服务器上现有的站点目录："
            ssh deploy-target "ls -1d /www/wwwroot/*/ 2>/dev/null || echo '  (无)'"
            exit 1
          fi
          echo "✅ 目录存在"

          if ! ssh deploy-target "test -w '${DEPLOY_PATH}'"; then
            echo "::error title=部署账号没有写权限::${DEPLOY_PATH} 对当前部署账号不可写。 请执行：chown -R \$USER:\$USER '${DEPLOY_PATH}'（把 \$USER 换成你的 SSH_USER）"
            echo "当前属主与权限："
            ssh deploy-target "ls -ld '${DEPLOY_PATH}'"
            exit 1
          fi
          echo "✅ 目录可写"

          # 检查 SSH_PORT 是否真的是 22（sshd_config 里 Port 常被注释）
          echo "✅ 预检通过，开始同步"

      # ---------------------------------------------------------------
      # 同步投流舱站点（adcabin.yuhuakeji.com.cn）
      #
      # 【刻意不使用 --delete】——服务器上已存在的、仓库里没有的文件一律不动。
      # 这样即便站点根目录里有历史遗留文件（旧页面、上传的图片、各类验证
      # 文件），也绝不会被误删。代价只是重命名/删除文件后旧文件会残留，
      # 需要时手工清理即可。
      #
      # 排除项：
      #   company/            公司官网源码位于本仓库的 company/ 子目录，
      #                       不能同步到投流舱站点下
      #   .well-known/        Let's Encrypt 证书验证目录，删掉会导致证书无法续期
      #   .user.ini           宝塔的 PHP 防跨站保护文件（带 immutable 属性）
      #   baidu_verify_* 等   搜索引擎验证文件，缺失会导致验证失效
      #   404.html            宝塔默认错误页
      #
      # 另注：-e 的字符串由 rsync 直接 exec、不经过 shell，因此必须用
      # $HOME（由 bash 展开）而不是 ~。用 ~ 会原样传给 ssh，导致
      # "Can't open user config file"。
      # ---------------------------------------------------------------
      - name: 同步投流舱站点文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlptzv --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='company/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='baidu_verify_*' \
            --exclude='google*.html' \
            --exclude='BingSiteAuth.xml' \
            --exclude='sogousiteverification.txt' \
            --exclude='404.html' \
            --exclude='.gitignore' \
            --exclude='.nojekyll' \
            --exclude='deploy/' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ deploy-target:"${DEPLOY_PATH}/"

      # ---------------------------------------------------------------
      # 同步公司官网（宇华科技 yuhuakeji.com.cn）
      #   源码位于仓库的 company/ 子目录。
      #   同样【不使用 --delete】，服务器上已有的 demo.html / Aipic.html /
      #   上传的图片等历史文件完全不受影响。
      #   未配置 DEPLOY_PATH_COMPANY 时自动跳过，不影响投流舱的部署。
      # ---------------------------------------------------------------
      - name: 同步公司官网文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH_COMPANY: ${{ secrets.DEPLOY_PATH_COMPANY }}
        run: |
          if [ -z "$DEPLOY_PATH_COMPANY" ]; then
            echo "::notice title=跳过公司官网部署::未配置 DEPLOY_PATH_COMPANY。若需一并部署，添加该 Secret（值为 /www/wwwroot/yuhuakeji.com.cn）并在服务器上把该目录属主改为部署账号。"
            exit 0
          fi
          if [ ! -d company ]; then
            echo "::warning title=缺少源码::仓库中没有 company/ 目录，跳过"
            exit 0
          fi
          if ! ssh deploy-target "test -d '${DEPLOY_PATH_COMPANY}'"; then
            echo "::error title=目标目录不存在::服务器上没有 ${DEPLOY_PATH_COMPANY}"
            ssh deploy-target "ls -1d /www/wwwroot/*/ 2>/dev/null || echo '  (无)'"
            exit 1
          fi
          if ! ssh deploy-target "test -w '${DEPLOY_PATH_COMPANY}'"; then
            echo "::error title=无写权限::${DEPLOY_PATH_COMPANY} 对部署账号不可写。请在服务器执行：chown -R <部署账号>:<部署账号> '${DEPLOY_PATH_COMPANY}'"
            ssh deploy-target "ls -ld '${DEPLOY_PATH_COMPANY}'"
            exit 1
          fi
          echo "✅ 目录存在且可写"

          # -----------------------------------------------------------
          # 内容校验闸门：确认目标目录真的是「宇华科技」官网。
          # 这台服务器上有 12 个 yuhuakeji.com.cn 的子站目录，路径写错一个
          # 就会把 index.html 覆盖到别人的站点上。所以必须验证目录内容，
          # 而不是只信任路径字符串。
          # -----------------------------------------------------------
          if ssh deploy-target "test -f '${DEPLOY_PATH_COMPANY}/index.html'"; then
            if ssh deploy-target "grep -q '宇华科技' '${DEPLOY_PATH_COMPANY}/index.html'"; then
              echo "✅ 内容校验通过：目标目录确认是「宇华科技」官网"
            else
              echo "::error title=目标目录不匹配::${DEPLOY_PATH_COMPANY}/index.html 中未找到「宇华科技」字样，可能指向了其他站点。已中止以防覆盖别的网站。"
              echo "该目录下 index.html 的开头内容："
              ssh deploy-target "head -c 300 '${DEPLOY_PATH_COMPANY}/index.html' || true"
              echo "该目录的文件列表："
              ssh deploy-target "ls -la '${DEPLOY_PATH_COMPANY}' || true"
              exit 1
            fi
          else
            echo "::warning title=首次部署::目标目录下暂无 index.html，将按首次部署处理；如果这不是预期，请检查 DEPLOY_PATH_COMPANY"
          fi
          echo "--- 部署前：目标目录现有文件（不会被删除）---"
          ssh deploy-target "ls -la '${DEPLOY_PATH_COMPANY}'"
          # 注意 *.html.md：GEO 用的 page.html.md 是给 AI 读的正文，必须部署。
          # 曾经这里写的是 --exclude='*.md'，把 5 个 GEO 文件全挡在服务器外面（线上 404）。
          # rsync 规则【先匹配先生效】，所以 --include='*.html.md' 必须排在排除之前。
          rsync -rlptzv --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='baidu_verify_*' \
            --exclude='google*.html' \
            --exclude='BingSiteAuth.xml' \
            --exclude='sogousiteverification.txt' \
            --exclude='src/' \
            --exclude='tailwind.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='改造说明.txt' \
            --exclude='node_modules/' \
            --include='*.html.md' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='*.md' \
            -e "ssh -F $HOME/.ssh/config" \
            company/ deploy-target:"${DEPLOY_PATH_COMPANY}/"
          echo "--- 部署后：确认关键文件已就位 ---"
          ssh deploy-target "test -f '${DEPLOY_PATH_COMPANY}/index.html' && echo '✅ index.html' ; test -f '${DEPLOY_PATH_COMPANY}/assets/tailwind.css' && echo '✅ assets/tailwind.css' ; ls '${DEPLOY_PATH_COMPANY}'/*.md >/dev/null 2>&1 && echo '✅ GEO .md 已同步' || echo '::warning title=GEO .md 未同步::公司站目录下没有 .md 文件，AI 爬虫将读不到 Markdown 正文'"

      - name: 校验服务器上的文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh deploy-target "ls -la '${DEPLOY_PATH}' && echo '---' && test -f '${DEPLOY_PATH}/index.html' && echo '✅ index.html 存在' && test -f '${DEPLOY_PATH}/assets/qr.png' && echo '✅ assets/qr.png 存在'"

      # ---------------------------------------------------------------
      # 部署后线上验证：内容、编码、资源可达
      # ---------------------------------------------------------------
      - name: 线上验证
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH_COMPANY: ${{ secrets.DEPLOY_PATH_COMPANY }}
        run: |
          HTTPS_URL="https://adcabin.yuhuakeji.com.cn/"
          HTTP_URL="http://adcabin.yuhuakeji.com.cn/"

          # 公司站只在配置了目录并成功同步时才校验（否则那里可能还是旧内容）
          COMPANY_LIVE=""
          if [ -n "${DEPLOY_PATH_COMPANY:-}" ]; then
            COMPANY_LIVE="https://yuhuakeji.com.cn/"
          fi

          URL=""
          for base in "$HTTPS_URL" "$HTTP_URL"; do
            for i in $(seq 1 6); do
              code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 20 "$base" || echo 000)
              [ "$code" = "200" ] && { URL="$base"; break; }
              echo "  $base -> HTTP $code，10 秒后重试 ($i/6)"
              sleep 10
            done
            [ -n "$URL" ] && break
          done

          if [ -z "$URL" ]; then
            echo "::error title=线上访问失败::DNS 解析或宝塔站点未生效。请确认：① DNSPod 已加 adcabin -> 62.234.44.62 的 A 记录 ② 宝塔已创建站点 ③ 站点根目录文件已就位"
            exit 1
          fi
          echo "✅ 可访问: $URL"

          if [ "$URL" = "$HTTP_URL" ]; then
            echo "::warning title=SSL 未就绪::目前仅能通过 http 访问。请在宝塔【站点设置 → SSL → Let's Encrypt】申请证书并开启「强制 HTTPS」，否则微信内会提示不安全。"
          else
            echo "✅ HTTPS 已就绪"
          fi

          echo "--- 内容校验 ---"
          fail=0
          for kw in "投流舱" "舱长负责跑量" "Skill 定制 + MCP 接入" "协助开户服务费" "种子客户招募" "剩余 3 席" "完整计费与退款细则"; do
            if grep -q "$kw" /tmp/index.html; then
              echo "  ✅ $kw"
            else
              echo "  ❌ 缺少: $kw"
              fail=1
            fi
          done

          echo "--- 资源校验 ---"
          qr=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}assets/qr.png" || echo 000)
          echo "  assets/qr.png -> HTTP $qr"
          [ "$qr" = "200" ] || fail=1

          # GEO 产物必须真的能访问：llms.txt 和 page.html.md 是给 AI 爬虫的入口。
          # 加这一步是因为公司站的 rsync 曾用 --exclude='*.md' 把 .md 全挡在服务器外，
          # 而部署本身"成功"、CI 全绿 —— 只有真去 curl 才发现线上是 404。
          echo "--- GEO 产物校验 ---"
          for u in "${URL}llms.txt" \
                   "${URL}blog/juliang-api-keng.html.md" \
                   "${URL}blog/juliang-roi-wei-0.html.md" \
                   "${URL}sitemap.xml" \
                   "${URL}robots.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "  ${u#${URL}} -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error title=GEO 产物不可达::$u 返回 $code"; fail=1; }
          done

          if [ -n "${COMPANY_LIVE:-}" ]; then
            for u in "${COMPANY_LIVE}llms.txt" \
                     "${COMPANY_LIVE}index.html.md" \
                     "${COMPANY_LIVE}sitemap.xml" \
                     "${COMPANY_LIVE}robots.txt"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
              echo "  [公司站] ${u#${COMPANY_LIVE}} -> HTTP $code"
              [ "$code" = "200" ] || { echo "::error title=公司站 GEO 产物不可达::$u 返回 $code"; fail=1; }
            done
          fi

          if [ "$fail" = "0" ]; then
            echo "🎉 部署完成且验证通过"
          else
            echo "::error::线上内容校验未通过"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 主动推送到百度站长平台（加速收录）
      #   两个站点各自独立验证、各有独立 token，必须分开推送。
      #   未配置对应 token 时优雅跳过，不影响部署。
      #
      # ⚠️ 关键坑：site 参数必须填【纯域名】。
      #    百度站长平台「API 提交」页面上给出的示例 URL 带 https:// 前缀，
      #    直接复制粘贴会一直返回 {"error":400,"message":"site init fail"}。
      #    实测对照：
      #      site=yuhuakeji.com.cn          -> {"remain":9,"success":1}  ✅
      #      site=https://yuhuakeji.com.cn  -> {"error":400,"site init fail"} ❌
      #      site=yuhuakeji.com.cn/         -> {"error":400,"site init fail"} ❌
      # ---------------------------------------------------------------
      - name: 推送到百度站长平台
        if: steps.cfg.outputs.skip != 'true'
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          BAIDU_TOKEN_ADCABIN: ${{ secrets.BAIDU_TOKEN_ADCABIN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # ---- 只推「本次真正改动」的页面，节省 10 条/天的配额 ----
          # 百度 API 配额很小（当前账号 10 条/天/站点），重复推送未变更的 URL
          # 是纯浪费。因此 push 事件下用 git diff 判断哪些 HTML 变了，只推那些；
          # 手动触发（workflow_dispatch）没有 diff 可比，则推全部。
          # ⚠️ schedule（每日定时）必须保持 CHANGED 为空：它的唯一目的是清空待推队列。
          #    如果这里也按「全量」处理，就会每天重复推 10 条没改动的 URL，
          #    把配额全烧在无意义的重复提交上（百度也不鼓励这么做）。
          EVENT="${{ github.event_name }}"
          CHANGED=""
          MANUAL="no"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MANUAL="yes"
          elif [ "$EVENT" = "push" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD^ HEAD -- '*.html' || true)
            else
              MANUAL="yes"   # 首次提交等没有父提交的情况，按全量处理
            fi
          fi

          echo "--- 触发方式：$EVENT ---"
          echo "--- 本次改动的 HTML 文件 ---"
          if [ "$MANUAL" = "yes" ]; then
            echo "(手动触发 → 推送全部 URL)"
          else
            echo "${CHANGED:-(无 → 只清待推队列，不消耗配额)}"
          fi

          # ---- 读取上次没推成功的 URL（跨运行保留，放在服务器上）----
          # 为什么需要它：百度配额只有 10 条/天，而「只推本次改动」意味着
          # 当天没推成的 URL 下次不会再出现 —— 不改动的页面永远不会被重推，
          # 于是一次配额用尽 = 这些 URL 永久漏推。用一个小队列兜住这件事。
          PENDING_FILE="${DEPLOY_PATH}/.baidu-pending.txt"
          ADC_PENDING=""
          if [ -n "${DEPLOY_PATH:-}" ]; then
            ADC_PENDING=$(ssh deploy-target "cat '${PENDING_FILE}' 2>/dev/null || true")
            if [ -n "$ADC_PENDING" ]; then
              echo "--- 上次遗留待推（$(printf '%s\n' "$ADC_PENDING" | grep -c .) 条）---"
              printf '%s\n' "$ADC_PENDING"
            fi
          fi

          push_site() {
            local name="$1" token="$2" site="$3" urls="$4" ndone
            # 顺序要紧：先判断有没有要推的 URL。否则会用空内容调一次 API，
            # 返回 {"error":400,"message":"empty content"} 并产生误导性警告。
            if [ -z "$urls" ]; then
              echo "[$name] 无需推送（本次没有改动该站点的页面）"
              return 0
            fi
            if [ -z "$token" ]; then
              echo "::notice title=跳过 $name 推送::未配置 token。到百度站长平台（ziyuan.baidu.com）「普通收录 → API 提交」获取后，添加名为 BAIDU_TOKEN 的 Secret 即可。"
              return 0
            fi
            local nsent
            nsent=$(printf '%s\n' "$urls" | grep -c .)
            echo "[$name] 将推送 $nsent 条 URL"
            resp=$(curl -s --max-time 30 -H 'Content-Type:text/plain' \
              --data-binary "$urls" \
              "http://data.zz.baidu.com/urls?site=${site}&token=${token}" \
              || echo '{"error":"curl failed"}')
            echo "[$name] 返回: $resp"
            ndone=$(printf '%s' "$resp" | grep -o '"success":[0-9]*' | grep -o '[0-9]*' || true)
            # 只有「全部推成功」才算成功。部分成功（success < 提交数）也要保留队列，
            # 否则没被接收的那几条就永远丢了。
            if [ -n "$ndone" ] && [ "$ndone" = "$nsent" ]; then
              echo "✅ [$name] 推送成功（$ndone/$nsent）"
              return 0
            fi
            echo "::warning title=$name 推送失败::返回 $resp —— 常见原因：site 参数带了协议头、token 与站点不匹配、站点未验证、或当日配额（10 条/天）用尽。不影响网站运行；未推成功的 URL 会进入队列，次日自动重推。"
            return 1
          }

          # 公司站：只有一个首页。仅当 company/ 下的【HTML】有改动（或手动触发）时才推。
          # 注意用 .*\.html$ 而非裸 ^company/：否则改 CSS/图片也会触发推送、白耗配额。
          ROOT_URLS=""
          if [ "$MANUAL" = "yes" ] || echo "$CHANGED" | grep -q '^company/.*\.html$'; then
            ROOT_URLS="https://yuhuakeji.com.cn/"
          fi

          # 投流舱：把改动的文件映射到对应 URL。
          # 以 sitemap.xml 作为唯一权威 URL 清单 —— 之前是硬编码白名单，
          # 结果新增的文章永远不会被推送（2026-09-19 那批 6 篇就漏推了）。
          ADC_URLS=""
          add_adc() { ADC_URLS="${ADC_URLS}${ADC_URLS:+$'\n'}$1"; }

          # ⚠️ 必须用 if 而不是 `grep -q ... && add_adc ...`：
          #    GitHub Actions 是 `bash -e`。在【函数内部】，最后一条命令返回 1
          #    会让整个函数返回 1，`bash -e` 随即终止整个步骤 —— 2026-09-19 那次
          #    「本次没有 HTML 改动」的情况下步骤直接 exit 1（部署其实是成功的）。
          #    `A && B` 写在顶层不受 -e 影响，但搬进函数就受，这是搬进函数时踩的坑。
          adc_maybe() {          # $1 = sitemap URL, $2 = 仓库内对应文件
            if [ "$MANUAL" = "yes" ]; then add_adc "$1"; return 0; fi
            if echo "$CHANGED" | grep -qxF "$2"; then add_adc "$1"; fi
            return 0
          }

          if [ -f sitemap.xml ]; then
            while IFS= read -r u; do
              [ -n "$u" ] || continue
              case "$u" in
                "https://adcabin.yuhuakeji.com.cn/")      f="index.html" ;;
                "https://adcabin.yuhuakeji.com.cn/blog/") f="blog/index.html" ;;
                "https://adcabin.yuhuakeji.com.cn/"*)     f="${u#https://adcabin.yuhuakeji.com.cn/}" ;;
                *) continue ;;
              esac
              adc_maybe "$u" "$f"
            done < <(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||')
          else
            echo "::warning title=缺少 sitemap.xml::无法推导投流舱 URL 清单，本次跳过百度推送。"
          fi

          # 合并队列与本次改动，按序去重。
          # 顺序是 FIFO：队列里的排前面（它们等得更久，先出队，避免被新 URL 饿死）。
          # URL 里不含空格，所以可以直接按词遍历。
          adc_merge() {          # $1 = 先出队的（更旧），$2 = 后加入的（更新）
            local seen=" " u out=""
            for u in $1 $2; do
              case "$seen" in *" $u "*) continue ;; esac
              seen="$seen$u "
              out="${out}${out:+$'\n'}$u"
            done
            printf '%s' "$out"
          }
          ADC_URLS=$(adc_merge "${ADC_PENDING:-}" "$ADC_URLS")

          # 百度 API 配额是 10 条/天/站点；超出的部分进队列，下次接着推。
          ADC_REST=""
          adc_n=$(printf '%s\n' "$ADC_URLS" | grep -c . || true)
          if [ "$adc_n" -gt 10 ]; then
            ADC_REST=$(printf '%s\n' "$ADC_URLS" | tail -n +11)
            ADC_URLS=$(printf '%s\n' "$ADC_URLS" | head -n 10)
            echo "::notice title=投流舱 URL 数超出百度配额::$adc_n 条 > 10 条/天，本次推 10 条，剩余 $(printf '%s\n' "$ADC_REST" | grep -c .) 条进队列次日重推。"
          fi

          # 百度 token 是【账号级】的，同一个 token 配不同 site 参数即可推多个站点。
          # 因此默认复用 BAIDU_TOKEN；BAIDU_TOKEN_ADCABIN 仅作为可选覆盖保留。
          push_site "公司官网" "${BAIDU_TOKEN}" "yuhuakeji.com.cn" "$ROOT_URLS"
          ADC_OK=1
          push_site "投流舱" "${BAIDU_TOKEN_ADCABIN:-$BAIDU_TOKEN}" "adcabin.yuhuakeji.com.cn" "$ADC_URLS" || ADC_OK=0

          # ---- 回写队列：成功的只留超额部分，失败的整批留 ----
          if [ -n "${DEPLOY_PATH:-}" ]; then
            if [ "$ADC_OK" = "1" ]; then
              NEW_PENDING="$ADC_REST"
            else
              NEW_PENDING=$(adc_merge "$ADC_URLS" "${ADC_REST:-}")
            fi
            if [ -n "$NEW_PENDING" ]; then
              printf '%s\n' "$NEW_PENDING" | ssh deploy-target "cat > '${PENDING_FILE}'"
              echo "--- 已入队，次日自动重推（$(printf '%s\n' "$NEW_PENDING" | grep -c .) 条）---"
              printf '%s\n' "$NEW_PENDING"
            else
              ssh deploy-target "rm -f '${PENDING_FILE}'"
              echo "✅ 队列已清空（没有待推 URL）"
            fi
          fi

          echo ""
          echo "说明：sitemap 提交（站长平台网页端一次性操作）不占上述 API 配额，适合批量发现；"
          echo "      API 推送配额仅 10 条/天/站点，因此本步骤只推本次真正改动的页面，"
          echo "      推不下的自动进队列，次日接着推，不会漏。"

      - name: 部署摘要
        if: steps.cfg.outputs.skip != 'true' && always()
        run: |
          {
            echo "## 官网部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 访问地址 | https://adcabin.yuhuakeji.com.cn/ |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 结果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
