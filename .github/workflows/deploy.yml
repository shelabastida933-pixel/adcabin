name: 部署官网到腾讯云服务器

# 触发方式：
#   1. push 到 main（我改完文案推上去就自动部署）
#   2. 在 GitHub 网页上手动点「Run workflow」
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发写同一台服务器
concurrency:
  group: deploy-adcabin
  cancel-in-progress: false

jobs:
  deploy:
    name: 同步到 adcabin.yuhuakeji.com.cn
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      # ---------------------------------------------------------------
      # 未配置密钥时优雅跳过，避免首次推送就出现红色失败
      # ---------------------------------------------------------------
      - name: 检查部署密钥是否已配置
        id: cfg
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::notice title=跳过部署::尚未配置部署密钥。请按 deploy/CI-CD部署指南.md 配置 Repository Secrets 后重跑本工作流。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "密钥已配置，准备部署"
          fi

      # ---------------------------------------------------------------
      # 安全闸门：目标路径必须位于宝塔站点目录下，防止误删服务器文件
      # ---------------------------------------------------------------
      - name: 安全校验（防止误删服务器文件）
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "目标路径: ${DEPLOY_PATH}"
          case "${DEPLOY_PATH}" in
            /www/wwwroot/*)
              # 必须至少有两级，且不能带 .. 或通配
              case "${DEPLOY_PATH}" in
                *..*|*\**)
                  echo "::error::路径包含非法字符，已中止"
                  exit 1 ;;
              esac
              echo "✅ 路径校验通过"
              ;;
            *)
              echo "::error::DEPLOY_PATH 必须位于 /www/wwwroot/ 之下，当前为 ${DEPLOY_PATH}，已中止以防误删"
              exit 1
              ;;
          esac

      - name: 配置 SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 首次连接自动接受主机指纹（免去手工维护 known_hosts）
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            Port ${SSH_PORT:-22}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: 测试 SSH 连通性
        if: steps.cfg.outputs.skip != 'true'
        run: |
          echo "=============================================="
          echo " 本次使用的私钥指纹（请与服务器对比）"
          echo "=============================================="
          if ssh-keygen -y -f ~/.ssh/id_deploy > /tmp/derived.pub 2>/tmp/keyerr; then
            FP=$(ssh-keygen -lf /tmp/derived.pub)
            echo "  $FP"
            echo ""
            echo "  服务器上请执行下面这条，两者的指纹【必须完全一致】："
            echo "    ssh-keygen -lf ~/.ssh/authorized_keys"
            echo ""
            echo "  派生的公钥内容（仅供比对，这是公开信息）："
            cat /tmp/derived.pub
          else
            echo "::error title=私钥无法解析::GitHub Secret「SSH_PRIVATE_KEY」的内容不是有效的私钥。常见原因：① 误填了 .pub 公钥文件 ② 复制时漏掉了 -----BEGIN/END----- 首尾两行 ③ 换行被破坏成了一行"
            echo "--- ssh-keygen 报错 ---"
            cat /tmp/keyerr
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo " 连接测试（详细模式）"
          echo "=============================================="
          set +e
          ssh -v deploy-target 'echo "连接成功: $(whoami)@$(hostname)"' > /tmp/ssh.log 2>&1
          rc=$?
          set -e
          grep -Ei "Offering public key|Server accepts key|Authentications that can continue|Next authentication method|Permission denied|Connection (refused|timed out|closed)|Load key" /tmp/ssh.log | head -20 || true

          if [ "$rc" != "0" ]; then
            echo ""
            echo "::error title=SSH 公钥认证失败::按顺序排查：① 服务器 authorized_keys 里是否包含上面打印的那个指纹（不一致说明 Secret 内容或公钥装错了）② 权限必须是 .ssh=700、authorized_keys=600、家目录不可被 group/other 写 ③ OpenCloudOS/RHEL 系需执行 restorecon -Rv 家目录/.ssh 修复 SELinux 上下文 ④ SSH_USER 是否与服务器实际用户名完全一致（不能有空格或换行）⑤ 该账号是否被锁定或过期（chage -l 用户名）"
            exit 1
          fi
          echo "✅ SSH 连接成功"

          ssh deploy-target 'which rsync >/dev/null && echo "✅ rsync 可用" || (echo "::error::服务器未安装 rsync，请执行 yum install -y rsync 或 apt install -y rsync"; exit 1)'

      # ---------------------------------------------------------------
      # 预检：把「目录不存在」「无写权限」这类问题翻译成可操作的中文提示，
      # 而不是让 rsync 抛一个看不懂的报错
      # ---------------------------------------------------------------
      - name: 预检目标目录
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "检查 ${DEPLOY_PATH}"

          if ! ssh deploy-target "test -d '${DEPLOY_PATH}'"; then
            echo "::error title=目标目录不存在::服务器上没有 ${DEPLOY_PATH}。 解决办法：在宝塔【网站 → 添加站点】创建站点，域名填 adcabin.yuhuakeji.com.cn，PHP 版本选「纯静态」，不要创建数据库和 FTP。"
            echo ""
            echo "服务器上现有的站点目录："
            ssh deploy-target "ls -1d /www/wwwroot/*/ 2>/dev/null || echo '  (无)'"
            exit 1
          fi
          echo "✅ 目录存在"

          if ! ssh deploy-target "test -w '${DEPLOY_PATH}'"; then
            echo "::error title=部署账号没有写权限::${DEPLOY_PATH} 对当前部署账号不可写。 请执行：chown -R \$USER:\$USER '${DEPLOY_PATH}'（把 \$USER 换成你的 SSH_USER）"
            echo "当前属主与权限："
            ssh deploy-target "ls -ld '${DEPLOY_PATH}'"
            exit 1
          fi
          echo "✅ 目录可写"

          # 检查 SSH_PORT 是否真的是 22（sshd_config 里 Port 常被注释）
          echo "✅ 预检通过，开始同步"

      # ---------------------------------------------------------------
      # 同步文件
      #   --delete   让服务器与仓库保持一致（删除已下线文件）
      #   排除项说明（宝塔服务器必须排除，否则 --delete 会破坏服务）：
      #     .well-known/   Let's Encrypt 证书验证目录，删掉会导致证书无法续期
      #     .user.ini      宝塔的 PHP 防跨站保护文件，且带 immutable 属性 ——
      #                    rsync 删不掉它会导致整个部署报错失败
      #     404.html       宝塔默认错误页，保留
      # ---------------------------------------------------------------
      # 注意：-e 的字符串由 rsync 直接 exec，不经过 shell，
      # 所以这里必须用 $HOME（由 bash 展开）而不是 ~ 或 ~/.ssh/config。
      # 用 ~ 会原样传给 ssh 导致 "Can't open user config file"。
      - name: 同步站点文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -rlptzv --delete --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/' \
            --exclude='.user.ini' \
            --exclude='404.html' \
            --exclude='.gitignore' \
            --exclude='.nojekyll' \
            --exclude='deploy/' \
            -e "ssh -F $HOME/.ssh/config" \
            ./ deploy-target:"${DEPLOY_PATH}/"

      - name: 校验服务器上的文件
        if: steps.cfg.outputs.skip != 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh deploy-target "ls -la '${DEPLOY_PATH}' && echo '---' && test -f '${DEPLOY_PATH}/index.html' && echo '✅ index.html 存在' && test -f '${DEPLOY_PATH}/assets/qr.png' && echo '✅ assets/qr.png 存在'"

      # ---------------------------------------------------------------
      # 部署后线上验证：内容、编码、资源可达
      # ---------------------------------------------------------------
      - name: 线上验证
        if: steps.cfg.outputs.skip != 'true'
        run: |
          HTTPS_URL="https://adcabin.yuhuakeji.com.cn/"
          HTTP_URL="http://adcabin.yuhuakeji.com.cn/"

          URL=""
          for base in "$HTTPS_URL" "$HTTP_URL"; do
            for i in $(seq 1 6); do
              code=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 20 "$base" || echo 000)
              [ "$code" = "200" ] && { URL="$base"; break; }
              echo "  $base -> HTTP $code，10 秒后重试 ($i/6)"
              sleep 10
            done
            [ -n "$URL" ] && break
          done

          if [ -z "$URL" ]; then
            echo "::error title=线上访问失败::DNS 解析或宝塔站点未生效。请确认：① DNSPod 已加 adcabin -> 62.234.44.62 的 A 记录 ② 宝塔已创建站点 ③ 站点根目录文件已就位"
            exit 1
          fi
          echo "✅ 可访问: $URL"

          if [ "$URL" = "$HTTP_URL" ]; then
            echo "::warning title=SSL 未就绪::目前仅能通过 http 访问。请在宝塔【站点设置 → SSL → Let's Encrypt】申请证书并开启「强制 HTTPS」，否则微信内会提示不安全。"
          else
            echo "✅ HTTPS 已就绪"
          fi

          echo "--- 内容校验 ---"
          fail=0
          for kw in "投流舱" "舱长负责跑量" "Skill 定制 + MCP 接入" "协助开户服务费" "种子客户招募" "剩余 3 席" "完整计费与退款细则"; do
            if grep -q "$kw" /tmp/index.html; then
              echo "  ✅ $kw"
            else
              echo "  ❌ 缺少: $kw"
              fail=1
            fi
          done

          echo "--- 资源校验 ---"
          qr=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}assets/qr.png" || echo 000)
          echo "  assets/qr.png -> HTTP $qr"
          [ "$qr" = "200" ] || fail=1

          if [ "$fail" = "0" ]; then
            echo "🎉 部署完成且验证通过"
          else
            echo "::error::线上内容校验未通过"
            exit 1
          fi

      - name: 部署摘要
        if: steps.cfg.outputs.skip != 'true' && always()
        run: |
          {
            echo "## 官网部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 访问地址 | https://adcabin.yuhuakeji.com.cn/ |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 结果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
